<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">TMC9660&lt;Comm&gt;, inc/tmc9660.hpp</text>
<text x="56" y="510.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="541" font-size="17" fill="#D2DAE4">SpiCommInterface / UartCommInterface: TMCL frames, NOT_READY polling, pipelined batches,</text>
<text x="56" y="565.7" font-size="17" fill="#D2DAE4">control pins by name (RST, DRV_EN, WAKE, FAULTN) with per-board active levels</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="693.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">spiTransferTMCL()  spiTransferBootloader()  gpioSet()  gpioRead()  delayUs()  delayMs()</text>
<text x="56" y="792.4" font-size="20" font-weight="700" fill="#E8EDF3">TMC9660</text>
<text x="56" y="823" font-size="17" fill="#D2DAE4">SPI mode 3 up to 10 MHz, or UART  /  RST, DRV_EN, WAKE, FAULTN</text>
