<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t-9660 d-9660">
  <title id="t-9660">TMC9660 Field-Oriented Control (FOC) signal flow</title>
  <desc id="d-9660">Position/velocity/torque setpoints feed PI controllers; Park transform converts measured 3-phase currents into d/q frame, the d/q PI controllers produce Vd/Vq, inverse Park + Space-Vector PWM modulator drives the 3-phase inverter and motor; an encoder/Hall sensor closes the angle loop.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .panelL   { fill: #ffffff; stroke: #1a365d; stroke-width: 2; }
      .chip     { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .ctrl     { fill: #ebf4ff; stroke: #2c5282; stroke-width: 1.6; }
      .xform    { fill: #f0fff4; stroke: #276749; stroke-width: 1.6; }
      .mod      { fill: #fff5f5; stroke: #c53030; stroke-width: 1.6; }
      .motor    { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .sum      { fill: #ffffff; stroke: #1a365d; stroke-width: 1.5; }
      .wire     { stroke: #2b6cb0; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-fb  { stroke: #c05621; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-3ph { stroke: #4a5568; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 10.5px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 10.5px; fill: #4a5568; text-anchor: start; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
    <marker id="ar-9660" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ar-fb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c05621"/>
    </marker>
  </defs>
  <rect class="panel" width="880" height="540"/>

  <text class="head" x="440" y="26">TMC9660 - Field-Oriented Control (FOC) signal flow</text>
  <text class="small" x="440" y="44">Parameter mode exposes 300+ knobs; the diagram below is the closed-loop torque/velocity/position controller you configure them against.</text>

  <!-- Big chip outline (y=72..400) -->
  <rect class="chip" x="20" y="72" width="780" height="328" rx="12"/>
  <text class="head" x="410" y="96">TMC9660 internal FOC pipeline</text>

  <!-- Setpoint inputs column (left), evenly spaced -->
  <g>
    <rect class="ctrl" x="40" y="130" width="120" height="44" rx="6"/>
    <text class="title" x="100" y="150">Position SP</text>
    <text class="small" x="100" y="166">user / TMCL</text>

    <rect class="ctrl" x="40" y="200" width="120" height="44" rx="6"/>
    <text class="title" x="100" y="220">Velocity SP</text>
    <text class="small" x="100" y="236">user / TMCL</text>

    <rect class="ctrl" x="40" y="270" width="120" height="44" rx="6"/>
    <text class="title" x="100" y="290">Torque SP</text>
    <text class="small" x="100" y="306">user / TMCL</text>
  </g>

  <!-- PI cascade column (next to setpoints) -->
  <rect class="ctrl" x="190" y="130" width="100" height="44" rx="6"/>
  <text class="title" x="240" y="150">Pos PI</text>
  <text class="small" x="240" y="166">-> vel ref</text>
  <line class="wire" x1="160" y1="152" x2="190" y2="152" marker-end="url(#ar-9660)"/>

  <rect class="ctrl" x="190" y="200" width="100" height="44" rx="6"/>
  <text class="title" x="240" y="220">Vel PI</text>
  <text class="small" x="240" y="236">-> Iq ref</text>
  <line class="wire" x1="160" y1="222" x2="190" y2="222" marker-end="url(#ar-9660)"/>
  <line class="wire" x1="240" y1="174" x2="240" y2="200" marker-end="url(#ar-9660)" stroke-dasharray="3 3"/>

  <!-- Iq summing junction (?) -->
  <circle class="sum" cx="330" cy="222" r="14"/>
  <text class="pin" x="330" y="226">&#931;</text>
  <line class="wire" x1="290" y1="222" x2="316" y2="222" marker-end="url(#ar-9660)"/>
  <line class="wire" x1="160" y1="292" x2="316" y2="222" marker-end="url(#ar-9660)" stroke-dasharray="3 3"/>
  <text class="smallL" x="160" y="284">torque-direct override</text>

  <!-- Iq PI -->
  <rect class="ctrl" x="380" y="200" width="80" height="44" rx="6"/>
  <text class="title" x="420" y="222">Iq PI</text>
  <text class="small" x="420" y="238">-> Vq</text>
  <line class="wire" x1="344" y1="222" x2="380" y2="222" marker-end="url(#ar-9660)"/>

  <!-- Id PI (target = 0 for SPM) -->
  <rect class="ctrl" x="380" y="130" width="80" height="44" rx="6"/>
  <text class="title" x="420" y="150">Id PI</text>
  <text class="small" x="420" y="166">-> Vd</text>
  <text class="smallL" x="380" y="122">Id ref = 0  (SPM)</text>

  <!-- Inverse Park + SVPWM -->
  <rect class="xform" x="500" y="160" width="140" height="84" rx="6"/>
  <text class="title" x="570" y="184">Inverse Park</text>
  <text class="title" x="570" y="202">+ SVPWM</text>
  <text class="small" x="570" y="220">d/q -> alpha/beta -> 3-phase</text>
  <text class="small" x="570" y="234">Space-Vector modulator</text>
  <line class="wire" x1="460" y1="152" x2="500" y2="180" marker-end="url(#ar-9660)"/>
  <line class="wire" x1="460" y1="222" x2="500" y2="220" marker-end="url(#ar-9660)"/>

  <!-- 3-phase gate driver / inverter -->
  <rect class="mod" x="660" y="160" width="120" height="84" rx="6"/>
  <text class="title" x="720" y="184">3-phase</text>
  <text class="title" x="720" y="202">gate driver</text>
  <text class="small" x="720" y="220">+ MOSFETs</text>
  <text class="small" x="720" y="234">protection</text>
  <line class="wire" x1="640" y1="200" x2="660" y2="200" marker-end="url(#ar-9660)"/>

  <!-- Forward Park / Clarke (bottom of chip area) -->
  <rect class="xform" x="500" y="290" width="140" height="60" rx="6"/>
  <text class="title" x="570" y="312">Park / Clarke</text>
  <text class="small" x="570" y="328">Iu/Iv/Iw -> Id/Iq</text>
  <text class="small" x="570" y="342">at electrical theta</text>

  <!-- Sensor stack (encoder/Hall) -->
  <rect class="ctrl" x="190" y="320" width="120" height="60" rx="6"/>
  <text class="title" x="250" y="340">Sensor stack</text>
  <text class="small" x="250" y="356">Hall &#183; ABZ &#183; SPI enc.</text>
  <text class="small" x="250" y="370">-> theta, omega</text>

  <!-- theta -> Park feedback wire -->
  <line class="wire-fb" x1="310" y1="340" x2="500" y2="320" marker-end="url(#ar-fb)"/>
  <text class="smallL" x="318" y="336">theta -> Park</text>

  <!-- Iu/Iv/Iw current sense feedback (loops down from gate driver) -->
  <line class="wire-fb" x1="720" y1="244" x2="720" y2="320" marker-end="url(#ar-fb)"/>
  <line class="wire-fb" x1="720" y1="320" x2="640" y2="320" marker-end="url(#ar-fb)"/>
  <text class="smallL" x="650" y="280">Iu/Iv/Iw current sense</text>

  <!-- Iq feedback to summing junction -->
  <line class="wire-fb" x1="500" y1="320" x2="330" y2="240" marker-end="url(#ar-fb)" stroke-dasharray="3 3"/>
  <text class="smallL" x="370" y="270">Iq feedback to &#931;</text>

  <!-- Motor + 3-phase wires (right of chip body) -->
  <rect class="motor" x="820" y="160" width="50" height="84" rx="6"/>
  <text class="title" x="845" y="184">Motor</text>
  <text class="small" x="845" y="202">BLDC</text>
  <text class="small" x="845" y="216">PMSM</text>
  <text class="small" x="845" y="230">Stepper</text>
  <line class="wire-3ph" x1="780" y1="190" x2="820" y2="190"/>
  <line class="wire-3ph" x1="780" y1="200" x2="820" y2="200"/>
  <line class="wire-3ph" x1="780" y1="210" x2="820" y2="210"/>
  <text class="small" x="800" y="178">U V W</text>

  <!-- MCU host band (y=410..480) -->
  <rect class="panelL" x="20" y="410" width="780" height="70" rx="6"/>
  <text class="title" x="410" y="430">MCU host  &#8644;  TMC9660  (SPI or UART)</text>
  <text class="small" x="410" y="450">bootloader init (Parameter mode) -> motorConfig.setType() -> focControl.setTargetVelocity()</text>
  <text class="small" x="410" y="466">telemetry: temperature &#183; current &#183; voltage &#183; position  &#183;  protection: OCP / OVP / OTP</text>

  <!-- Legend in its own bottom row (y=496..520) -->
  <g transform="translate(20, 500)">
    <text class="titleL" x="0" y="0" fill="#1a365d">Legend</text>
    <rect class="ctrl" x="80"  y="-10" width="14" height="14"/>
    <text class="legend" x="100" y="0">Control loop</text>
    <rect class="xform" x="220" y="-10" width="14" height="14"/>
    <text class="legend" x="240" y="0">Reference-frame xform</text>
    <rect class="mod"   x="400" y="-10" width="14" height="14"/>
    <text class="legend" x="420" y="0">Power stage</text>
    <line class="wire"    x1="540" y1="-3" x2="564" y2="-3" marker-end="url(#ar-9660)"/>
    <text class="legend" x="572" y="0">Forward path</text>
    <line class="wire-fb" x1="690" y1="-3" x2="714" y2="-3" marker-end="url(#ar-fb)"/>
    <text class="legend" x="722" y="0">Feedback (sensors)</text>
  </g>
</svg>
