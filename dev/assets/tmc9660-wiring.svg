<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460"
     role="img" aria-labelledby="t-wiring d-wiring">
  <title id="t-wiring">TMC9660 &#8212; typical MCU wiring (SPI mode)</title>
  <desc id="d-wiring">Wiring diagram showing SPI and control pin connections from an MCU to the TMC9660 FOC motor controller board, with three-phase outputs to a BLDC / PMSM / Stepper motor.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .box      { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .chip     { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .motor    { fill: #f0fff4; stroke: #276749; stroke-width: 2; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #4a5568; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-spi { stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-ctrl{ stroke: #276749; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 5 3; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: start; }
      .pinR     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: end; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
    <marker id="ar-spi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ar-spi-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#2b6cb0"/>
    </marker>
    <marker id="ar-ctrl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#276749"/>
    </marker>
    <marker id="ar-ctrl-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#276749"/>
    </marker>
    <marker id="ar-motor" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#276749"/>
    </marker>
  </defs>
  <rect class="panel" width="920" height="460"/>

  <!-- Title -->
  <text class="head" x="460" y="28">TMC9660 &#8212; typical MCU wiring (SPI mode)</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP MCU BOX (left) PPPPPPPPPPPPPPPPPPPPPPP -->
  <rect class="box" x="40" y="52" width="200" height="330" rx="10"/>
  <text class="title" x="140" y="76">MCU (ESP32 / STM32)</text>

  <!-- MCU SPI pins (right-aligned labels, exit right edge at x=240) -->
  <text class="pinR" x="230" y="115">MOSI</text>
  <text class="pinR" x="230" y="143">MISO</text>
  <text class="pinR" x="230" y="171">SCLK</text>
  <text class="pinR" x="230" y="199">CS</text>

  <!-- MCU control pins -->
  <text class="pinR" x="230" y="241">RST</text>
  <text class="pinR" x="230" y="265">DRV_EN</text>
  <text class="pinR" x="230" y="289">FAULTN</text>
  <text class="pinR" x="230" y="313">WAKE</text>

  <!-- MCU GND -->
  <text class="pinR" x="230" y="355">GND</text>

  <!-- Section labels inside MCU box -->
  <text class="smallL" x="54" y="100">SPI</text>
  <text class="smallL" x="54" y="228">Control</text>
  <text class="smallL" x="54" y="344">Power</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP TMC9660 BOX (center-right) PPPPPPPPPPPPPPPPPPPPPPP -->
  <rect class="chip" x="460" y="52" width="230" height="330" rx="10"/>
  <text class="title" x="575" y="76">TMC9660 Board</text>
  <text class="small" x="575" y="92">FOC motor controller</text>

  <!-- TMC9660 SPI pins (left-aligned labels, enter left edge at x=460) -->
  <text class="pinL" x="472" y="115">SPI MOSI</text>
  <text class="pinL" x="472" y="143">SPI MISO</text>
  <text class="pinL" x="472" y="171">SPI SCLK</text>
  <text class="pinL" x="472" y="199">SPI CS</text>

  <!-- TMC9660 control pins -->
  <text class="pinL" x="472" y="241">RST</text>
  <text class="pinL" x="472" y="265">DRV_EN</text>
  <text class="pinL" x="472" y="289">FAULTN</text>
  <text class="pinL" x="472" y="313">WAKE</text>

  <!-- TMC9660 GND -->
  <text class="pinL" x="472" y="355">GND</text>

  <!-- TMC9660 motor output pins (right side) -->
  <text class="pinR" x="680" y="160">U</text>
  <text class="pinR" x="680" y="190">V</text>
  <text class="pinR" x="680" y="220">W</text>

  <!-- Motor output section label -->
  <text class="smallL" x="636" y="138">Motor</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP SPI WIRES (blue, solid) PPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- MOSI: MCU -> TMC -->
  <line class="wire-spi" x1="240" y1="111" x2="460" y2="111" marker-end="url(#ar-spi)"/>
  <!-- MISO: TMC -> MCU -->
  <line class="wire-spi" x1="240" y1="139" x2="460" y2="139" marker-start="url(#ar-spi-rev)"/>
  <!-- SCLK: MCU -> TMC -->
  <line class="wire-spi" x1="240" y1="167" x2="460" y2="167" marker-end="url(#ar-spi)"/>
  <!-- CS: MCU -> TMC -->
  <line class="wire-spi" x1="240" y1="195" x2="460" y2="195" marker-end="url(#ar-spi)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP CONTROL WIRES (green, dashed) PPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- RST: MCU -> TMC -->
  <line class="wire-ctrl" x1="240" y1="237" x2="460" y2="237" marker-end="url(#ar-ctrl)"/>
  <!-- DRV_EN: MCU -> TMC -->
  <line class="wire-ctrl" x1="240" y1="261" x2="460" y2="261" marker-end="url(#ar-ctrl)"/>
  <!-- FAULTN: TMC -> MCU (open-drain output) -->
  <line class="wire-ctrl" x1="240" y1="285" x2="460" y2="285" marker-start="url(#ar-ctrl-rev)"/>
  <!-- WAKE: MCU -> TMC -->
  <line class="wire-ctrl" x1="240" y1="309" x2="460" y2="309" marker-end="url(#ar-ctrl)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP GND WIRE (grey) PPPPPPPPPPPPPPPPPPPPPPP -->
  <line class="wire-gnd" x1="240" y1="351" x2="460" y2="351"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP MOTOR BOX (far right) PPPPPPPPPPPPPPPPPPPPPPP -->
  <rect class="motor" x="760" y="120" width="130" height="140" rx="10"/>
  <text class="title" x="825" y="150">Motor</text>
  <text class="small" x="825" y="170">BLDC / PMSM</text>
  <text class="small" x="825" y="186">/ Stepper</text>

  <!-- Motor pins (left-aligned on left edge at x=760) -->
  <text class="pinL" x="772" y="216">U</text>
  <text class="pinL" x="772" y="234">V</text>
  <text class="pinL" x="772" y="252">W</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP MOTOR WIRES (green, solid) PPPPPPPPPPPPPPPPPPPPPPP -->
  <!-- U: TMC -> Motor -->
  <polyline class="wire-ctrl" x1="690" y1="156" x2="760" y2="212"
            points="690,156 720,156 720,212 760,212"
            style="stroke-dasharray: none; stroke: #276749; stroke-width: 2.5" marker-end="url(#ar-motor)"/>
  <!-- V: TMC -> Motor -->
  <polyline points="690,186 726,186 726,230 760,230"
            style="stroke: #276749; stroke-width: 2.5; fill: none; stroke-linecap: round" marker-end="url(#ar-motor)"/>
  <!-- W: TMC -> Motor -->
  <polyline points="690,216 732,216 732,248 760,248"
            style="stroke: #276749; stroke-width: 2.5; fill: none; stroke-linecap: round" marker-end="url(#ar-motor)"/>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP DIRECTION ANNOTATIONS PPPPPPPPPPPPPPPPPPPPPPP -->
  <text class="smallL" x="310" y="106">MCU &#8594; TMC</text>
  <text class="smallL" x="310" y="134">TMC &#8594; MCU</text>
  <text class="smallL" x="310" y="162">MCU &#8594; TMC</text>
  <text class="smallL" x="310" y="190">MCU &#8594; TMC</text>
  <text class="smallL" x="310" y="280">TMC &#8594; MCU</text>

  <!-- PPPPPPPPPPPPPPPPPPPPPPP LEGEND PPPPPPPPPPPPPPPPPPPPPPP -->
  <g transform="translate(40, 406)">
    <text class="titleL" x="0" y="0">Legend</text>

    <!-- Row 1 -->
    <line class="wire-spi" x1="0" y1="18" x2="28" y2="18" marker-end="url(#ar-spi)"/>
    <text class="legend" x="36" y="22">SPI bus (MOSI, MISO, SCLK, CS)</text>

    <line class="wire-ctrl" x1="300" y1="18" x2="328" y2="18" marker-end="url(#ar-ctrl)"/>
    <text class="legend" x="336" y="22">Control signal (RST, DRV_EN, FAULTN, WAKE)</text>

    <!-- Row 2 -->
    <line class="wire-gnd" x1="0" y1="38" x2="28" y2="38"/>
    <text class="legend" x="36" y="42">Common ground</text>

    <line x1="300" y1="38" x2="328" y2="38"
          style="stroke: #276749; stroke-width: 2.5; fill: none; stroke-linecap: round" marker-end="url(#ar-motor)"/>
    <text class="legend" x="336" y="42">Three-phase motor output (U, V, W)</text>
  </g>
</svg>
