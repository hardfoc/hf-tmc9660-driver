###############################################################################
# TMC9660 Driver – ESP-IDF Component Manifest
###############################################################################

name: hf-tmc9660-driver
version: "1.0.0"
description: |
  Hardware-agnostic TMC9660 motor driver supporting BLDC, stepper, and DC motors.
  Features FOC, sensorless operation, telemetry, bootloader support,
  and both parameter mode and register mode interfaces.

url: "https://www.analog.com/en/products/tmc9660.html"
repository: "https://github.com/hardfoc/hf-tmc9660-driver.git"
documentation: "https://github.com/hardfoc/hf-tmc9660-driver/blob/main/README.md"
issues: "https://github.com/hardfoc/hf-tmc9660-driver/issues"

license: "GPL-3.0"
maintainers:
  - "HardFOC"

targets:
  - esp32
  - esp32c6
  - esp32s3
  - esp32c3

dependencies:
  idf: ">=5.0.0"

tags:
  - "tmc9660"
  - "motor-control"
  - "bldc"
  - "stepper"
  - "foc"
  - "driver"
  - "spi"
  - "uart"
  - "hardware-agnostic"
