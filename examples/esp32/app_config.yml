# ESP32 HardFOC Interface Wrapper - Apps Configuration
# This file centralizes all app definitions, their source files, and metadata
# Used by build scripts, flash scripts, CI workflows, and CMake
#
# HIERARCHICAL CONFIGURATION:
# - Global settings in 'metadata' section apply to all apps by default
# - Individual apps can override 'idf_versions' and 'build_types' if needed
# - Apps without overrides use global settings automatically

version: "1.0"
metadata:
  project: "ESP32 TMC9660 Driver Examples"
  default_app: "bldc_comprehensive_test"
  target: "esp32c6"
  idf_versions: ["release/v5.5", "release/v5.4"]
  build_types: [["Debug", "Release"], ["Debug"]]

apps:
  bldc_comprehensive_test:
    description: "Comprehensive BLDC motor testing suite with Hall sensors, ABN encoders, and velocity control"
    source_file: "bldc_comprehensive_test.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  stepper_comprehensive_test:
    description: "Comprehensive Stepper motor testing suite with FOC and step/dir control"
    source_file: "stepper_comprehensive_test.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  dc_comprehensive_test:
    description: "Comprehensive DC motor testing suite with current control and velocity control"
    source_file: "dc_comprehensive_test.cpp"
    category: "motor_control"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  telemetry_comprehensive_test:
    description: "Comprehensive telemetry monitoring test suite for temperature, current, voltage, and status"
    source_file: "telemetry_comprehensive_test.cpp"
    category: "monitoring"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  bootloader_comprehensive_test:
    description: "Comprehensive bootloader testing suite for initialization and configuration validation"
    source_file: "bootloader_comprehensive_test.cpp"
    category: "system"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true

  tmcl_timing:
    description: "TMCL SPI access timing: single vs pipelined, frame-gap sweep, latency histogram"
    source_file: "tmcl_timing.cpp"
    category: "system"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: false

build_config:
  build_types:
    Debug:
      description: "Debug symbols, verbose logging, assertions enabled"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build optimized for performance and size"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]

  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_tmc9660_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  # Apps to exclude from specific build types (if needed)
  exclude_combinations: []
  # Apps that require special handling
  special_apps: []

